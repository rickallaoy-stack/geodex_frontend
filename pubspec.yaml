name: geodex
description: "Cadastre minier Côte d'Ivoire"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^1.1.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.1
  crypto: ^3.0.3
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  connectivity_plus: ^6.0.5
  shared_preferences: ^2.2.3
  qr_flutter: ^4.1.0
  share_plus: ^7.2.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  pdf: ^3.10.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/geology_ci.geojson
    - assets/Gemini_Generated_Image_.png
    - assets/images/
