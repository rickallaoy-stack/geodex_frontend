name: geodex
description: "Cadastre minier Côte d'Ivoire"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.1
  crypto: ^3.0.3
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/geology_ci.geojson
    - assets/Gemini_Generated_Image_.png
